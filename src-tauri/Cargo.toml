[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = { version = "0.30.1", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt", "macros", "fs", "io-util", "rt-multi-thread", "sync"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v4"] }
flate2 = "1.1.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
